<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Profile</title>

<style>

body{
    margin:0;
    font-family: Arial;
    background-color:#ffffff;
}

/* ===== TOP BAR ===== */
.topbar{
    height:60px;
    background:#effcff;
    display:flex;
    align-items:center;
    padding:0 20px;
    position:relative;
}

.menu{font-size:28px;cursor:pointer;}

/* 🔥 LOGO */
.header-logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}
.header-logo img{
    height:40px;
}

/* ICONS */
.top-icons{
    display:flex;
    gap:15px;
    align-items:center;
    margin-left:auto;
}
.top-icons img{
    width:22px;
    cursor:pointer;
}

/* 🌐 LANGUAGE */
.lang-switcher{position:relative;}

.lang-dropdown{
    position:absolute;
    top:28px;
    right:0;
    background:#fff;
    display:none;
    border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.lang-dropdown.active{display:block;}

.lang-option{
    padding:6px 10px;
    cursor:pointer;
}

/* ===== SIDEBAR ===== */
.sidebar{
    position:fixed;
    top:60px;
    left:-250px;
    right:auto;
    width:230px;
    height:100%;
    background:#effcff;
    padding:15px;
    transition:0.3s;
}

.profile-header{
    display:flex;
    gap:10px;
    align-items:center;
}
.profile-header img{width:40px;}

.profile-info{
    font-size:14px;
    color:#2c5d7c;
}

.menu-item{
    display:flex;
    gap:10px;
    margin-top:15px;
    cursor:pointer;
    color:#2c5d7c;
}
.menu-item img{width:20px;}

/* ===== CONTENT ===== */
.content{
    padding-top:120px;
    display:flex;
    justify-content:center;
}

.profile-box{
    background:#effcff;
    width:450px;
    padding:20px;
    border-radius:10px;
}

.profile-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
    color:#2c5d7c;
}

.profile-title img{width:40px;}

.form-row{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

.field{width:48%;}

label{
    font-size:13px;
    color:#2c5d7c;
}

input, select{
    width:100%;
    padding:6px;
    border:1px solid #999;
    background:transparent;
    border-radius:4px;
}

.gender{display:flex;gap:15px;margin-top:5px;}

.date-row{display:flex;gap:5px;}
.date-row select{width:33%;}

.full{width:100%;margin-top:10px;}

input[readonly], select:disabled {
    background: #f5f5f5;
    cursor: default;
}

</style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="topbar">

<div class="menu" onclick="toggleSidebar()">☰</div>

<!-- LOGO -->
<div class="header-logo">
<img src="../images/diab muaazir.svg">
</div>

<!-- LANGUAGE -->
<div class="top-icons">

<div class="lang-switcher">
<img src="../images/language.svg" id="langToggle">

<div class="lang-dropdown" id="langDropdown">
<div class="lang-option" data-lang="en">English</div>
<div class="lang-option" data-lang="ar">العربية</div>
</div>

</div>

</div>

</div>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">

<div class="profile-header">
<img src="../images/profile icon.png">
<div class="profile-info" id="profileInfo"></div>
</div>

<div class="menu-item" onclick="goTo('profile.html')"><img src="../images/profile.png"><span id="navProfile"></span></div>
<div class="menu-item" onclick="goTo('patients.html')"><img src="../images/patients.png"><span id="navPatients"></span></div>
<div class="menu-item" onclick="goTo('calendar.html')"><img src="../images/calendar.png"><span id="navCalendar"></span></div>
<div class="menu-item" onclick="goTo('settings.html')"><img src="../images/gear.svg"><span id="navSettings"></span></div>
<div class="menu-item" onclick="goTo('../feedback.html')"><img src="../images/feedback.png"><span id="navFeedback"></span></div>
<div class="menu-item" onclick="goTo('../about.html')"><img src="../images/info.svg"><span id="navAbout"></span></div>
<div class="menu-item" onclick="goTo('../contact.html')"><img src="../images/phone.svg"><span id="navContact"></span></div>
<div class="menu-item" onclick="goTo('../faq.html')"><img src="../images/frequently asked questions.png"><span id="navFaq"></span></div>
<div class="menu-item" onclick="logout()"> <span id="navLogout">Logout</span></div>
</div>

<!-- ===== CONTENT ===== -->
<div class="content">

<div class="profile-box">

<div class="profile-title">
<img src="../images/profile icon.png">
<span id="title"></span>
</div>

<!-- نفس الفورم بدون تغيير -->
<div class="form-row">
<div class="field">
<label id="nameLabel"></label>
<input type="text" id="nameInput" readonly>
</div>

<div class="field">
    <label id="genderLabel"></label>
    <input type="text" id="genderInput" readonly>
    </div>
</div>

<div class="form-row">
<div class="field">
<label id="ageLabel"></label>
<input type="text" id="ageInput" readonly>
</div>

<div class="field">
<label id="dobLabel"></label>
<div class="date-row">
<select id="month" disabled></select>
<select id="day"disabled></select>
<select id="year"disabled></select>
</div>
</div>
</div>

<div class="form-row">
<div class="field">
<label id="phoneLabel"></label>
<input type="text" id="phoneInput"readonly>
</div>

<div class="field">
<label id="addressLabel"></label>
<input type="text" id="addressInput"readonly>
</div>
</div>

<div class="form-row">
<div class="field">
<label id="emailLabel"></label>
<input type="email" id="emailInput"readonly>
</div>

</div>
<div class="full">
    <label id="fileLabel"></label>
    <input type="text" id="certificateInput" readonly>
    </div>
</div>
</div>

<script type="module">

let lang = localStorage.getItem("lang") || "en";
import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { db, auth } from "../js/firebase-config.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
  window.location.href = "../index.html";
}

/* 🔥 LANGUAGE */
document.getElementById("langToggle").onclick = (e) => {
  e.stopPropagation();
  toggleLang();
};

document.querySelectorAll(".lang-option").forEach(opt => {
  opt.onclick = () => {
    setLang(opt.dataset.lang);
  };
});

document.onclick=()=>{
document.getElementById("langDropdown").classList.remove("active");
};

/* 🔥 الاتجاه + المنيو */
let sidebar=document.getElementById("sidebar");
let icons=document.querySelector(".top-icons");

if(lang==="ar"){
document.body.style.direction="rtl";
sidebar.style.right="-250px";
sidebar.style.left="auto";
icons.style.marginLeft="0";
icons.style.marginRight="auto";
}else{
document.body.style.direction="ltr";
sidebar.style.left="-250px";
sidebar.style.right="auto";
icons.style.marginRight="0";
icons.style.marginLeft="auto";
}

/* 🔥 فتح المنيو */
function toggleSidebar(){
if(lang==="ar"){
sidebar.style.right = sidebar.style.right==="0px"?"-250px":"0";
}else{
sidebar.style.left = sidebar.style.left==="0px"?"-250px":"0";
}
}
function toggleLang() {
  document.getElementById("langDropdown").classList.toggle("active");
}

function setLang(selectedLang) {
  localStorage.setItem("lang", selectedLang);
  location.reload();
}
function goTo(p) {
  if (lang === "ar") {
    if (p === "../feedback.html") p = "../feedback-ar.html";
    if (p === "../about.html") p = "../about-us-ar.html";
    if (p === "../contact.html") p = "../contact-us-ar.html";
    if (p === "../faq.html") p = "../faq-ar.html";
  }

  window.location.href = p;
}

/* 🔥 ترجمة (نفس كودك الأصلي) */
const t={
en:{
title:"My Profile",
name:"Full Name",
gender:"Gender",
male:"Male",
female:"Female",
age:"Age",
dob:"Date of Birth",
phone:"Phone Number",
address:"Address",
email:"Email Address",
file:"Uploaded certificate",
navProfile:"Profile",
navPatients:"Patients",
navCalendar:"Calendar",
navSettings:"Settings",
navFeedback:"Feedback",
navAbout:"About us",
navContact:"Contact us",
navFaq:"FAQ",
logout:"logout"
},
ar:{
title:"ملفي الشخصي",
name:"الاسم الكامل",
gender:"الجنس",
male:"ذكر",
female:"أنثى",
age:"العمر",
dob:"تاريخ الميلاد",
phone:"رقم الجوال",
address:"العنوان",
email:"البريد الإلكتروني",
file:"الشهادة",
navProfile:"الملف الشخصي",
navPatients:"المرضى",
navCalendar:"التقويم",
navSettings:"الإعدادات",
navFeedback:"الملاحظات",
navAbout:"من نحن",
navContact:"تواصل معنا",
navFaq:"الأسئلة الشائعة",
logout:"تسجيل الخروج"
}
};

document.getElementById("title").innerText=t[lang].title;
document.getElementById("nameLabel").innerText=t[lang].name;
document.getElementById("genderLabel").innerText=t[lang].gender;
document.getElementById("ageLabel").innerText=t[lang].age;
document.getElementById("dobLabel").innerText=t[lang].dob;
document.getElementById("phoneLabel").innerText=t[lang].phone;
document.getElementById("addressLabel").innerText=t[lang].address;
document.getElementById("emailLabel").innerText=t[lang].email;
document.getElementById("fileLabel").innerText=t[lang].file;
document.getElementById("navProfile").innerText=t[lang].navProfile;
document.getElementById("navPatients").innerText=t[lang].navPatients;
document.getElementById("navSettings").innerText=t[lang].navSettings;
document.getElementById("navFeedback").innerText=t[lang].navFeedback;
document.getElementById("navAbout").innerText=t[lang].navAbout;
document.getElementById("navContact").innerText=t[lang].navContact;
document.getElementById("navFaq").innerText=t[lang].navFaq;
document.getElementById("navCalendar").innerText=t[lang].navCalendar;
document.getElementById("navLogout").innerText=lang === "ar" ? "تسجيل الخروج" : "Logout";
/* 🔥 DOB (تاريخ الميلاد) */
let day = document.getElementById("day");
let month = document.getElementById("month");
let year = document.getElementById("year");

/* الأيام */
for(let i=1;i<=31;i++){
    let op=document.createElement("option");
    op.value=i;
    op.textContent=i;
    day.appendChild(op);
}

/* السنوات */
let currentYear = new Date().getFullYear();
for(let i=currentYear;i>=1950;i--){
    let op=document.createElement("option");
    op.value=i;
    op.textContent=i;
    year.appendChild(op);
}

/* الشهور */
const months = lang==="ar"
? ["يناير","فبراير","مارس","أبريل","مايو","يونيو",
   "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]
: ["Jan","Feb","Mar","Apr","May","Jun",
   "Jul","Aug","Sep","Oct","Nov","Dec"];

months.forEach((m,i)=>{
    let op=document.createElement("option");
    op.value=i+1;
    op.textContent=m;
    month.appendChild(op);
});

async function logout() {
  try {
    await signOut(auth); // 🔥 Firebase logout

    // 🔥 clear app session
    localStorage.removeItem("currentUser");
    localStorage.removeItem("selectedPatient");

    // optional: clear everything
    // localStorage.clear();

    // 🔥 redirect to login page
    window.location.href = "../index.html";

  } catch (error) {
    console.error(error);
    alert("Logout failed");
  }
}

async function loadDoctorProfile() {
  const savedUser = JSON.parse(localStorage.getItem("currentUser"));

  if (!savedUser || !savedUser.uid) return;

  try {
    const doctorRef = doc(db, "Doctor", savedUser.uid);
    const doctorSnap = await getDoc(doctorRef);

    if (!doctorSnap.exists()) return;

    const data = doctorSnap.data();

    // sidebar info
    document.getElementById("profileInfo").innerHTML = `
      <b>${data.firstName || ""} ${data.lastName || ""}</b><br>
      ${lang === "ar" ? "العمر" : "Age"}: ${data.age || "--"}<br>
      ${data.email || ""}
    `;

    // form fields
    document.getElementById("nameInput").value =
      `${data.firstName || ""} ${data.lastName || ""}`.trim();

    document.getElementById("ageInput").value =
      data.age || "";

    document.getElementById("phoneInput").value =
      data.phone || "";

    document.getElementById("addressInput").value =
      data.address || "";

    document.getElementById("emailInput").value =
      data.email || "";

    document.getElementById("genderInput").value =
      data.gender || "";
    
      document.getElementById("certificateInput").value =
      data.certificateName || "No certificate uploaded";

      if (data.dob) {
  const dob = new Date(data.dob);

  document.getElementById("day").value = dob.getDate();
  document.getElementById("month").value = dob.getMonth() + 1;
  document.getElementById("year").value = dob.getFullYear();
}

  } catch (error) {
    console.error("Error loading profile:", error);
  }
}
loadDoctorProfile();

window.toggleSidebar = toggleSidebar;
window.toggleLang = toggleLang;
window.setLang = setLang;
window.goTo = goTo;
window.logout = logout;
</script>

</body>
</html>
