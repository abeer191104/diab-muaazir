<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
  <div class="form-container">

    <img class="auth-logo" src="images/diab muaazir.svg" alt="Logo">

    <h2>Create an Account</h2>

    <form id="registerForm" novalidate>

      <div class="row">
        <input id="firstName" name="firstName" type="text" placeholder="First Name" required>
        <span id="firstNameError" class="error-msg"></span>
        <input id="lastName" name="lastName" type="text" placeholder="Last Name" required>
        <span id="lastNameError" class="error-msg"></span>
      </div>

<div class="input-group">
  <input id="email" name="email" type="email" placeholder="email" required>
  <small id="emailError" class="error-message"></small>
</div>
      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="Password" required />
        <small id="passwordError" class="error-message"></small>
      </div>

      <div id="passwordStrengthBar" style="
  width: 100%;
  height: 6px;
  background: #eee;
  border-radius: 6px;
  margin-top: 6px;
  overflow: hidden;
">
  <div id="passwordStrengthFill" style="
    height: 100%;
    width: 0%;
    background: red;
    transition: width 0.3s ease;
  "></div>
</div>

      <div class="input-group">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required />
        <small id="confirmPasswordError" class="error-message"></small>
      </div>

      <div class="input-group">
        <input
          type="tel"
          id="phone"
          name="phone"
          inputmode="numeric"
          maxlength="10"
          placeholder="05XXXXXXXX"
          required
        />
        <small id="phoneError" class="error-message"></small>
      </div>

      <div class="input-group">
        <input type="date" name="dob" id="dob" required>
        <small id="dobError" class="error-message"></small>
      </div>

      <div class="input-group">
        <input id="address" name="address" type="text" placeholder="Physical Address" required>
        <small id="addressError" class="error-message"></small>
      </div>

      <div class="gender-selection">
        <p>Select Gender:</p>

        <label class="gender-option">
          <input type="radio" name="gender" value="male" required>
          <span>Male</span>
        </label>

        <label class="gender-option">
          <input type="radio" name="gender" value="female" required>
          <span>Female</span>
        </label>

        <small id="genderError" class="error-message"></small>
      </div>

      <div class="role-selection">
        <p>Select Role:</p>

        <label class="role-option">
          <input type="radio" name="role" value="Doctor" required>
          <span>Doctor</span>
        </label>

        <label class="role-option">
          <input type="radio" name="role" value="Patient" required>
          <span>Patient</span>
        </label>

        <label class="role-option">
          <input type="radio" name="role" value="Parent" required>
          <span>Parent</span>
        </label>

        <small id="roleError" class="error-message"></small>
      </div>

      <div id="doctorField" class="hidden">
        <label>Upload Doctor License:</label>
        <input id="doctorLicense" type="file" />
        <small id="doctorLicenseError" class="error-message"></small>
      </div>

      <button type="submit" class="btn">Register</button>

      <p class="form-link">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>
    <a href="index.html" class="back-link" >← Go Back</a>

    </form>
  </div>
  <script type="module" src="js/script.js"></script>
</body>
</html>
