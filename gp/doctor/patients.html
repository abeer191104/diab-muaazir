<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patients</title>

<style>
body{margin:0;font-family:Arial;overflow-x:hidden;}

.topbar{
height:60px;
background:#effcff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
position:relative;
}

.menu{font-size:28px;cursor:pointer;}

.header-logo{
position:absolute;
left:50%;
transform:translateX(-50%);
}
.header-logo img{height:40px;}

.top-icons{
display:flex;
gap:15px;
align-items:center;
} 
.top-icons img{width:22px;cursor:pointer;}

.notif-wrapper{position:relative;display:inline-block;}
.notif-badge{
position:absolute;
top:-6px;
right:-6px;
background:red;
color:white;
font-size:11px;
min-width:16px;
height:16px;
padding:0 4px;
border-radius:10px;
display:none;
align-items:center;
justify-content:center;
font-weight:bold;
}

.lang-switcher{position:relative;}
.lang-box{
position:absolute;
top:30px;
right:-20px;
background:#fff;
border:1px solid #ccc;
display:none;
border-radius:6px;
z-index:1000;
}
html[dir="rtl"] .lang-box{
right:auto;
left:0;
}
.lang-box div{padding:8px;cursor:pointer;}
.lang-box div:hover{background:#eee;}

.sidebar{
position:fixed;
top:60px;
width:230px;
height:100%;
background:#effcff;
padding:15px;
transition:0.3s;
z-index:1000;
}

.profile-header{display:flex;gap:10px;align-items:center;}
.profile-header img{width:40px;}

.menu-item{
display:flex;
gap:10px;
margin-top:15px;
align-items:center;
cursor:pointer;
}
.menu-item img{width:20px;}

.content{padding-top:90px;}

.section-title{
margin:20px 40px 10px;
font-weight:bold;
display:flex;
gap:8px;
align-items:center;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
padding:0 40px;
}

.card{
background:#effcff;
height:130px;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-size:12px;
cursor:pointer;
position:relative;
}

.critical-card{border:2px solid red;}
.normal-card{border:2px solid green;}

.glucose{
position:absolute;
top:5px;
right:5px;
background:#4a6c8a;
color:#fff;
font-size:10px;
padding:3px 6px;
border-radius:8px;
}
</style>
</head>

<body>

<div class="topbar">
<div class="menu" onclick="toggleSidebar()">☰</div>

<div class="header-logo">
<img src="../images/diab muaazir.svg">
</div>

<div class="top-icons">
<img src="../images/location.svg">

<div class="notif-wrapper">
<img src="../images/notifications.svg" onclick="goTo('critical patient.html')">
<span id="notifBadge" class="notif-badge"></span>
</div>

<div class="lang-switcher">
<img src="../images/language.svg" onclick="toggleLang()">
<div class="lang-box" id="langBox">
<div onclick="setLang('en')">English</div>
<div onclick="setLang('ar')">العربية</div>
</div>
</div>
</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<div class="profile-header">
<img src="../images/profile icon.png">
<div id="profileInfo"></div>
</div>

<div class="menu-item" onclick="goTo('profile.html')">
<img src="../images/profile.png"><span id="nav1"></span>
</div>

<div class="menu-item" onclick="goTo('patients.html')">
<img src="../images/patients.png"><span id="nav2"></span>
</div>

<div class="menu-item" onclick="goTo('calendar.html')">
<img src="../images/calendar.png"><span id="nav8"></span>
</div>

<div class="menu-item" onclick="goTo('settings.html')">
<img src="../images/gear.svg"><span id="nav3"></span>
</div>

<div class="menu-item" onclick="goTo('../feedback.html')">
<img src="../images/feedback.png"><span id="nav4"></span>
</div>

<div class="menu-item" onclick="goTo('../about.html')">
<img src="../images/info.svg"><span id="nav5"></span>
</div>

<div class="menu-item" onclick="goTo('../contact.html')">
<img src="../images/phone.svg"><span id="nav6"></span>
</div>

<div class="menu-item" onclick="goTo('../faq.html')">
<img src="../images/frequently asked questions.png"><span id="nav7"></span>
</div>

<div class="menu-item" onclick="logout()">
  <span id="navLogout">Logout</span>
</div>

</div>

<div class="content">

<h3 id="title" style="text-align:center"></h3>

<div class="section-title" style="color:red" id="cTitle"></div>
<div class="grid" id="criticalGrid"></div>

<div class="section-title" style="color:green" id="nTitle"></div>
<div class="grid" id="normalGrid"></div>

</div>

<script type="module">

let lang = localStorage.getItem("lang") || "en";
const user = JSON.parse(localStorage.getItem("currentUser"));
if (!user || user.role !== "Doctor") {
  window.location.href = "../login.html";
}
if (!user) {
  window.location.href = "../index.html";
  throw new Error("No user session"); // ⛔ stop execution
}
import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { db, auth } from "../js/firebase-config.js";

import {
  collection,
  getDocs,
  doc,
  getDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* TEXT */
const t={
en:{title:"Patients",critical:"🚨 Critical Patients",normal:"🩺 Normal Patients",age:"Age",status:"Status",high:"High",low:"Low",normalText:"Normal",profile:"Profile",patients:"Patients",calendar:"Calendar",settings:"Settings",feedback:"Feedback",about:"About us",contact:"Contact us",faq:"FAQ",logout:"logout"},
ar:{title:"المرضى",critical:"🚨 المرضى الحرجين",normal:"🩺 المرضى الطبيعيين",age:"العمر",status:"الحالة",high:"مرتفع",low:"منخفض",normalText:"طبيعي",profile:"الملف الشخصي",patients:"المرضى",calendar:"التقويم",settings:"الإعدادات",feedback:"الملاحظات",about:"من نحن",contact:"تواصل معنا",faq:"الأسئلة الشائعة", logout:"تسجيل الخروج"}
};

/* APPLY */
document.getElementById("title").innerText = t[lang].title;
document.getElementById("cTitle").innerText = t[lang].critical;
document.getElementById("nTitle").innerText = t[lang].normal;

document.getElementById("nav1").innerText = t[lang].profile;
document.getElementById("nav2").innerText = t[lang].patients;
document.getElementById("nav3").innerText = t[lang].settings;
document.getElementById("nav4").innerText = t[lang].feedback;
document.getElementById("nav5").innerText = t[lang].about;
document.getElementById("nav6").innerText = t[lang].contact;
document.getElementById("nav7").innerText = t[lang].faq;
document.getElementById("nav8").innerText = t[lang].calendar;
document.getElementById("navLogout").innerText = lang === "ar" ? "تسجيل الخروج" : "Logout";


/* SIDEBAR */
let sidebar=document.getElementById("sidebar");

if(lang==="ar"){
document.body.style.direction="rtl";
sidebar.style.right="-250px";
sidebar.style.left="auto";
}else{
document.body.style.direction="ltr";
sidebar.style.left="-250px";
sidebar.style.right="auto";
}

function toggleSidebar(){
if(lang==="ar"){
sidebar.style.right = sidebar.style.right==="0px"?"-250px":"0";
}else{
sidebar.style.left = sidebar.style.left==="0px"?"-250px":"0";
}
}

/* LANGUAGE */
function toggleLang(){
let b=document.getElementById("langBox");
b.style.display = b.style.display==="block"?"none":"block";
}
function setLang(l){
localStorage.setItem("lang",l);
location.reload();
}

/* NAV */
function goTo(p) {
  if (lang === "ar") {
    if (p === "../feedback.html") p = "../feedback-ar.html";
    if (p === "../about.html") p = "../about-us-ar.html";
    if (p === "../contact.html") p = "../contact-us-ar.html";
    if (p === "../faq.html") p = "../faq-ar.html";
  }

  window.location.href = p;
}
async function logout() {
  try {
    await signOut(auth); // 🔥 Firebase logout

    // 🔥 clear app session
localStorage.removeItem("currentUser");
localStorage.removeItem("tempUser");
localStorage.removeItem("selectedPatient");
localStorage.removeItem("selectedDoctorId");
localStorage.removeItem("login_otp");
localStorage.removeItem("login_otp_expiry");
    

    // 🔥 redirect to login page
    window.location.href = "../index.html";

  } catch (error) {
    console.error(error);
    alert("Logout failed");
  }
}
async function loadDoctorProfile() {
  const savedUser = JSON.parse(localStorage.getItem("currentUser"));
localStorage.setItem("selectedDoctorId", savedUser.uid);
  if (!savedUser || !savedUser.uid) return;

  try {
    const doctorRef = doc(db, "Doctor", savedUser.uid);
    const doctorSnap = await getDoc(doctorRef);

    if (!doctorSnap.exists()) return;

    const data = doctorSnap.data();

    document.getElementById("profileInfo").innerHTML = `
      <b>${data.firstName || ""} ${data.lastName || ""}</b><br>
      ${lang === "ar" ? "العمر" : "Age"}: ${data.age || "--"}<br>
      ${data.email || ""}
    `;

  } catch (error) {
    console.error("Error loading doctor profile:", error);
  }
}

let patients = [];

async function loadPatients() {
  try{
   const querySnapshot = await getDocs(collection(db, "Patient"));

  patients = [];

  querySnapshot.forEach((docSnap) => {
    const data = docSnap.data();

    let glucose = 110;

    if (data.currentGlucose) {
      glucose = data.currentGlucose;
    }

    let status = "normal";

    if (glucose < 70) {
      status = "low";
    } else if (glucose > 180) {
      status = "high";
    }

    patients.push({
  id: docSnap.id,
  firstName: data.firstName || "",
  lastName: data.lastName || "",
  age: data.age || "--",
  glucose: glucose,
  status: status
});
  });

  render();
updateNotificationBadge();

  } catch (error) {
    console.error("Error loading patients:", error);
  }
}

loadDoctorProfile();
onSnapshot(collection(db, "Patient"), () => {
  loadPatients();
});

/* BADGE */
async function updateNotificationBadge(){

  const badge = document.getElementById("notifBadge");

  try {
    const snapshot = await getDocs(collection(db, "Patient"));

    let count = 0;

    snapshot.forEach(docSnap => {
      const data = docSnap.data();

      let glucose = data.currentGlucose || 110;

if (glucose < 70 || glucose > 180) {
  count++;
}
    });

    if (count > 0) {
      badge.style.display = "flex";
      badge.textContent = count > 9 ? "9+" : count;
    } else {
      badge.style.display = "none";
    }

  } catch (error) {
    console.error(error);
  }
}


/* RENDER */
function render(){
  const criticalGrid = document.getElementById("criticalGrid");
  const normalGrid = document.getElementById("normalGrid");

  criticalGrid.innerHTML = "";
  normalGrid.innerHTML = "";

  patients.forEach(p => {

    // ✅ CREATE FIRST
    let card = document.createElement("div");
    card.className = "card";

    // ✅ NAME
    let name = `${p.firstName || ""} ${p.lastName || ""}`.trim() || "Patient";

    // ✅ STATUS TEXT
    let statusText =
      p.status === "high" ? t[lang].high :
      p.status === "low" ? t[lang].low :
      t[lang].normalText;

    // ✅ CONTENT
    card.innerHTML = `
      <div class="glucose">${p.glucose}</div>
      <div>
        ${name}<br>
        ${t[lang].age}: ${p.age}<br>
        ${t[lang].status}: ${statusText}
      </div>
    `;

    // ✅ CLICK (optional but recommended)
    card.onclick = () => {
      localStorage.setItem("selectedPatient", JSON.stringify(p));
      window.location.href = "contact_patient.html";
    };

    // ✅ NOW USE card safely
    if (p.status === "high" || p.status === "low") {
      card.classList.add("critical-card");
      criticalGrid.appendChild(card);
    } else {
      card.classList.add("normal-card");
      normalGrid.appendChild(card);
    }

  });
}
window.toggleSidebar = toggleSidebar;
window.toggleLang = toggleLang;
window.setLang = setLang;
window.goTo = goTo;
window.logout = logout;
</script>

</body>
</html>
