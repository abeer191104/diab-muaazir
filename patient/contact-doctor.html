<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact my doctor</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="contact-doctor-page">

  <!-- Header -->
  <header class="app-header">
    <div class="left-icons">
      <div class="hamburger" id="menuToggle">
        <span></span><span></span><span></span>
      </div>
    </div>
<a href="../ar/patient-dashboard-ar.html" class="header-logo">
  <img src="../images/diab muaazir.svg" alt="Logo">
</a>
 <div class="right-icons">
<div class="icon-btn notification-wrapper" id="notificationBtn">
  <img src="../images/notifications.svg">
  <span id="notificationBadge" class="notification-badge"></span>
</div>
  <div class="icon-btn" onclick="openfindpump()">
    <img src="../images/location.svg" alt="Location">
  </div>
  <div class="lang-switcher">
  <img src="../images/language.svg" id="langToggle" class="lang-icon">

  <div class="lang-dropdown" id="langDropdown">
<div class="lang-option active" data-lang="en">🇬🇧 English</div>
<div class="lang-option" data-lang="ar">🇸🇦 العربية</div>
  </div>
</div>
</div>
  </header>

  <!-- Overlay + Side Menu -->
  <div class="menu-overlay" id="menuOverlay"></div>
<!-- Side Menu -->
<nav class="side-menu" id="sideMenu">
  <h3 class="menu-title">Menu</h3>
<div class="menu-user">
  <div class="user-avatar">
    <img id="userProfilePic" src="../images/profile icon.png" alt="Profile">
  </div>

  <div class="user-details">
    <div class="user-name" id="menuUserName">Guest</div>
    <div class="user-age" id="menuUserAge">Age: --</div>
    <div class="user-email" id="menuUserEmail">email@example.com</div>
  </div>
</div>

 <ul>
  <li>
    <a href="patient.html">
      <img src="../images/pt-dashboard.svg" alt="Dashboard Icon" class="menu-icon">
      Dashboard
    </a>
  </li>

  <li>
    <a href="profile.html">
      <img src="../images/profile.png" alt="Profile Icon" class="menu-icon">
      Profile
    </a>
  </li>

  <li>
    <a href="sugar-history.html">
      <img src="../images/sugar-chart.svg" alt="History Icon" class="menu-icon">
      Sugar Level History
    </a>
  </li>

  <li>
    <a href="settings.html">
      <img src="../images/gear.svg" alt="Settings Icon" class="menu-icon">
      Settings
    </a>
  </li>

  <li>
    <a href="../feedback.html">
      <img src="../images/feedback.png" alt="Feedback Icon" class="menu-icon">
      Feedback
    </a>
  </li>

  <li>
    <a href="../about.html">
      <img src="../images/info.svg" alt="About Icon" class="menu-icon">
      About Us
    </a>
  </li>

  <li>
    <a href="../contact.html">
      <img src="../images/phone.svg" alt="Contact Icon" class="menu-icon">
      Contact Us
    </a>
  </li>

  <li>
    <a href="../faq.html">
      <img src="../images/frequently asked questions.png" alt="FAQ Icon" class="menu-icon">
      FAQ
    </a>
  </li>

  <li>
    <a href="../index.html">Logout</a></li>
</ul>

</nav>


<main class="cmd-wrapper">

  <h1 class="cmd-title">Contact my doctor</h1>

  <div class="cmd-topbar">
    <h2>Contact my doctor</h2>
    <button id="cmdCloseBtn" class="cmd-close" type="button">✕</button>
  </div>

  <div class="cmd-doctor">
    <div class="cmd-avatar"></div>
<div class="cmd-doctor-name" id="cmdDoctorName"></div>
  </div>

  <!-- CHAT -->
  <div class="cmd-chat" id="cmdChat"></div>

  <!-- INPUT -->
  <form class="cmd-inputbar" id="cmdForm">
    <input id="cmdMessage" type="text" placeholder="Type a message..." autocomplete="off" />
    <button type="submit" id="cmdSendBtn" class="cmd-send">Send</button>
  </form>

</main>
<script type="module" src="../js/script.js"></script>
</body>
</html>
