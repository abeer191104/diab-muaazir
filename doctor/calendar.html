<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calendar</title>

<style>
body{margin:0;font-family:Arial;background:#fff;}

.topbar{
height:60px;
background:#effcff;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
position:relative;
}

.header-logo{
position:absolute;
left:50%;
transform:translateX(-50%);
}
.header-logo img{height:40px;}

.menu{font-size:28px;cursor:pointer;}

.top-icons{
display:flex;
gap:15px;
align-items:center;
}
.top-icons img{width:24px;cursor:pointer;}

/* 🔴 BADGE */
.notif-wrapper{position:relative;}
.notif-badge{
position:absolute;
top:-6px;
right:-6px;
background:red;
color:white;
font-size:11px;
min-width:16px;
height:16px;
padding:0 4px;
border-radius:10px;
display:none;
align-items:center;
justify-content:center;
}

/* 🌐 LANGUAGE */
.lang-switcher{position:relative;}
.lang-dropdown{
position:absolute;
top:35px;
right:0;
background:#fff;
border:1px solid #ccc;
display:none;
border-radius:6px;
}
.lang-dropdown div{padding:8px;cursor:pointer;}
.lang-dropdown div:hover{background:#eee;}

/* 🔷 SIDEBAR */
.sidebar{
position:fixed;
top:60px;
left:-250px;
width:230px;
height:100%;
background:#effcff;
padding:15px;
transition:0.3s;
z-index:999;
}

.profile-header{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px;
}
.profile-header img{width:40px;}

.profile-info{
font-size:14px;
color:#2c5d7c;
}

.menu-item{
display:flex;
align-items:center;
gap:10px;
margin-top:15px;
cursor:pointer;
color:#2c5d7c;
}
.menu-item img{width:20px;}

.title{
text-align:center;
font-size:28px;
margin-top:15px;
}

.calendar{
width:95%;
margin:auto;
display:flex;
flex-direction:column;
gap:25px;
}

.month-row{
display:flex;
justify-content:space-between;
gap:15px;
}

.month{width:23%;}

.month-title{
background:black;
color:white;
text-align:center;
padding:4px;
}

.days{
display:grid;
grid-template-columns:repeat(7,1fr);
}

.day{
padding:6px;
text-align:center;
cursor:pointer;
border-radius:50%;
}

.day:hover{background:#add8e6;}
.selected{background:#5a9db5;color:white;}

/* 🔥 POPUP */
.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
justify-content:center;
align-items:center;
z-index:1000;
}

.popup-box{
background:#fff;
padding:25px;
border-radius:15px;
width:350px;
text-align:center;
}

.popup-box select,
.popup-box input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

.popup-buttons{
display:flex;
justify-content:space-between;
}

.popup-buttons button{
padding:10px 20px;
border:none;
border-radius:20px;
cursor:pointer;
}

.ok{background:#0b6d6d;color:white;}
.cancel{background:#ccc;}

</style>
</head>

<body>

<div class="topbar">

<div class="menu" onclick="toggleSidebar()">☰</div>

<div class="header-logo">
<img src="../images/diab muaazir.svg">
</div>

<div class="top-icons">

<img src="../images/location.svg">

<div class="notif-wrapper">
<img src="../images/notifications.svg" onclick="goTo('critical patient.html')">
<span id="notifBadge" class="notif-badge"></span>
</div>

<div class="lang-switcher">
<img src="../images/language.svg" id="langToggle">
<div class="lang-dropdown" id="langDropdown">
<div onclick="setLang('en')">English</div>
<div onclick="setLang('ar')">العربية</div>
</div>
</div>

</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<div class="profile-header">
<img src="../images/profile icon.png">
<div class="profile-info" id="profileInfo"></div>
</div>

<div class="menu-item" onclick="goTo('profile.html')"><img src="../images/profile.png"><span id="nav1"></span></div>
<div class="menu-item" onclick="goTo('patients.html')"><img src="../images/patients.png"><span id="nav2"></span></div>
<div class="menu-item" onclick="goTo('calendar.html')"><img src="../images/calendar.png"><span id="nav3"></span></div>
<div class="menu-item" onclick="goTo('settings.html')"><img src="../images/gear.svg"><span id="nav4"></span></div>
<div class="menu-item" onclick="goTo('../feedback.html')"><img src="../images/feedback.png"><span id="nav5"></span></div>
<div class="menu-item" onclick="goTo('../about.html')"><img src="../images/info.svg"><span id="nav6"></span></div>
<div class="menu-item" onclick="goTo('../contact.html')"><img src="../images/phone.svg"><span id="nav7"></span></div>
<div class="menu-item" onclick="goTo('../faq.html')"><img src="../images/frequently asked questions.png"><span id="nav8"></span></div>
<div class="menu-item" onclick="logout()"><span id="navLogout">Logout</span></div>
</div>

<div class="title" id="title"></div>
<div class="calendar" id="calendar"></div>

<!-- BOOKING POPUP -->
<div class="popup" id="bookingPopup">
<div class="popup-box">

<h3 id="popupTitle"></h3>

<select id="patientSelect"></select>
<input type="time" id="timeInput">


<div class="popup-buttons">
<button class="ok" onclick="saveBooking()">OK</button>
<button class="cancel" onclick="closePopup()">Cancel</button>
</div>

</div>
</div>

<!-- VIEW POPUP -->
<div class="popup" id="viewPopup">
<div class="popup-box">

<h3 id="viewName"></h3>
<p id="viewTime"></p>

<p id="deleteText"></p>

<div class="popup-buttons">
<button class="ok" onclick="deleteBooking()">Delete</button>
<button class="cancel" onclick="closeView()">Cancel</button>
</div>

</div>
</div>

<script type="module">

/* 🌐 LANGUAGE */
let lang = localStorage.getItem("lang") || "en";
import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { db, auth } from "../js/firebase-config.js";

import {
  doc,
  getDoc,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
  window.location.href = "../index.html";
}
function setLang(l){
localStorage.setItem("lang",l);
location.reload();
}

document.getElementById("langToggle").onclick = (e)=>{
  e.stopPropagation();
  document.getElementById("langDropdown").style.display = "block";
};

document.addEventListener("click",()=>{
  document.getElementById("langDropdown").style.display = "none";
});

/* اتجاه */
let sidebar = document.getElementById("sidebar");

if(lang==="ar"){
document.body.style.direction="rtl";
sidebar.style.right="-250px";   // مقفل
sidebar.style.left="auto";
}else{
document.body.style.direction="ltr";
sidebar.style.left="-250px";   // مقفل
sidebar.style.right="auto";
}

/* 🔥 نصوص */
const t={
en:["Calendar","Profile","Patients","Calendar","Settings","Feedback","About us","Contact us","FAQ","logout"],
ar:["التقويم","الملف الشخصي","المرضى","التقويم","الإعدادات","الملاحظات","من نحن","تواصل معنا","الأسئلة","تسجيل الخروج"]
};
// 🔥 نصوص إضافية
const extraText = {
en:{
popup:"Book Appointment",
delete:"Delete this booking?",
ok:"OK",
cancel:"Cancel"
},
ar:{
popup:"حجز موعد",
delete:"هل تريد حذف الموعد؟",
ok:"تأكيد",
cancel:"إلغاء"
}
};

// تطبيقها
document.getElementById("popupTitle").innerText = extraText[lang].popup;
document.getElementById("deleteText").innerText = extraText[lang].delete;

// الأزرار
document.querySelectorAll(".ok").forEach(b=>b.innerText=extraText[lang].ok);
document.querySelectorAll(".cancel").forEach(b=>b.innerText=extraText[lang].cancel);

document.getElementById("title").innerText = t[lang][0];
document.getElementById("nav1").innerText = t[lang][1];
document.getElementById("nav2").innerText = t[lang][2];
document.getElementById("nav3").innerText = t[lang][3];
document.getElementById("nav4").innerText = t[lang][4];
document.getElementById("nav5").innerText = t[lang][5];
document.getElementById("nav6").innerText = t[lang][6];
document.getElementById("nav7").innerText = t[lang][7];
document.getElementById("nav8").innerText = t[lang][8];
document.getElementById("navLogout").innerText=lang === "ar" ? "تسجيل الخروج" : "Logout";

async function logout() {
  try {
    await signOut(auth); // 🔥 Firebase logout

    // 🔥 clear app session
    localStorage.removeItem("currentUser");
    localStorage.removeItem("selectedPatient");

    // optional: clear everything
    // localStorage.clear();

    // 🔥 redirect to login page
    window.location.href = "../index.html";

  } catch (error) {
    console.error(error);
    alert("Logout failed");
  }
}

async function loadDoctorProfile() {
  const savedUser = JSON.parse(localStorage.getItem("currentUser"));

  if (!savedUser || !savedUser.uid) return;

  try {
    const doctorRef = doc(db, "Doctor", savedUser.uid);
    const doctorSnap = await getDoc(doctorRef);

    if (!doctorSnap.exists()) return;

    const data = doctorSnap.data();

    document.getElementById("profileInfo").innerHTML = `
      <b>${data.firstName || ""} ${data.lastName || ""}</b><br>
      ${lang === "ar" ? "العمر" : "Age"}: ${data.age || "--"}<br>
      ${data.email || ""}
    `;
  } catch (error) {
    console.error(error);
  }
}

/* 🔔 BADGE */
async function updateNotificationBadge(){

  const badge = document.getElementById("notifBadge");

  try {
    const snapshot = await getDocs(collection(db, "Patient"));

    let count = 0;

    snapshot.forEach(docSnap => {
      const data = docSnap.data();

      if (data.status === "high" || data.status === "low") {
        count++;
      }
    });

    if (count > 0) {
      badge.style.display = "flex";
      badge.textContent = count > 9 ? "9+" : count;
    } else {
      badge.style.display = "none";
    }

  } catch (error) {
    console.error(error);
  }
}
setInterval(updateNotificationBadge,5000);
updateNotificationBadge();

/* 📅 CALENDAR */
const months = (lang==="ar") ?
["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]
:
["January","February","March","April","May","June","July","August","September","October","November","December"];
let bookings={};
let selectedDate="";

function getDaysInMonth(month, year) {
  return new Date(year, month, 0).getDate();
}

function generateCalendar(){
let calendar=document.getElementById("calendar");
calendar.innerHTML="";

for(let r=0;r<3;r++){
let row=document.createElement("div");
row.className="month-row";

for(let c=0;c<4;c++){
let i=r*4+c;

let m=document.createElement("div");
m.className="month";

let title=document.createElement("div");
title.className="month-title";
const year = new Date().getFullYear();
title.innerText = months[i] + " " + year;

let days=document.createElement("div");
days.className="days";

let daysInMonth = getDaysInMonth(i + 1, year);

for (let d = 1; d <= daysInMonth; d++) {

  let day = document.createElement("div");
  day.className = "day";
  day.innerText = d;

  let fullDate = `${d}-${i+1}-${year}`;

  if (bookings[fullDate]) {
    day.style.background = "red";
    day.style.color = "white";
  }

  day.onclick = function () {
    selectedDate = fullDate;

    if (bookings[selectedDate]) {
  const booking = bookings[selectedDate][0]; // first booking only

  document.getElementById("viewName").innerText = booking.name;
  document.getElementById("viewTime").innerText = booking.time;

  document.getElementById("viewPopup").style.display = "flex";
  return;
}

    openPopup();
  };

  days.appendChild(day);
}


m.appendChild(title);
m.appendChild(days);
row.appendChild(m);
}
calendar.appendChild(row);
}
}
async function loadBookings() {

  const savedUser = JSON.parse(localStorage.getItem("currentUser"));
  if (!savedUser || !savedUser.uid) return;

  bookings = {};

  try {
    const q = query(
      collection(db, "Bookings"),
      where("doctorId", "==", savedUser.uid)
    );

    const querySnapshot = await getDocs(q);

    querySnapshot.forEach((docSnap) => {
      const data = docSnap.data();

  if (!bookings[data.date]) {
     bookings[data.date] = [];
    }
  bookings[data.date].push({
    name: data.patientName,
    time: data.time,
     id: docSnap.id
   });
    });

    generateCalendar();

  } catch (error) {
    console.error(error);
  }
}
loadBookings();

/* 🔥 POPUP */
async function openPopup() {
  document.getElementById("bookingPopup").style.display = "flex";

  const select = document.getElementById("patientSelect");
  select.innerHTML = "";

  try {
const snapshot = await getDocs(collection(db, "Patient"));

console.log("Patient snapshot:", snapshot.size);

    snapshot.forEach(doc => {
      const data = doc.data();

      let op = document.createElement("option");

      op.textContent = lang === "ar"
  ? `${data.firstName_ar || data.firstName || ""} ${data.lastName_ar || data.lastName || ""}`.trim()
  : `${data.firstName || ""} ${data.lastName || ""}`.trim();

      select.appendChild(op);
    });

  } catch (error) {
    console.error(error);
  }
}

function closePopup() {
  document.getElementById("bookingPopup").style.display = "none";
}

async function saveBooking() {

  const savedUser = JSON.parse(localStorage.getItem("currentUser"));
  if (!savedUser || !savedUser.uid) return;

  let name = document.getElementById("patientSelect").value;
  let time = document.getElementById("timeInput").value;

  if (!time) {
    alert(lang === "ar" ? "يرجى اختيار الوقت" : "Please select a time");
    return;
  }
if (bookings[selectedDate]) {
  alert(lang === "ar" ? "هذا اليوم محجوز بالفعل" : "This day is already booked");
  return;
}

  try {
    await addDoc(collection(db, "Bookings"), {
      doctorId: savedUser.uid,
      patientName: name,
      time: time,
      date: selectedDate
    });
document.getElementById("calendar").innerHTML =
  lang === "ar" ? "جاري التحميل..." : "Loading...";

    closePopup();
    loadBookings(); // 🔥 reload from firebase

  } catch (error) {
    console.error(error);
  }
}

async function deleteBooking() {

  if (!bookings[selectedDate] || bookings[selectedDate].length === 0) return;

  const booking = bookings[selectedDate][0];

  if (!booking.id) return;

  try {
    await deleteDoc(doc(db, "Bookings", booking.id));

    delete bookings[selectedDate];

    document.getElementById("viewPopup").style.display = "none";

    generateCalendar();

  } catch (error) {
    console.error(error);
  }
}

function closeView() {
  document.getElementById("viewPopup").style.display = "none";
}


function toggleSidebar(){

if(lang==="ar"){
sidebar.style.right = sidebar.style.right==="0px" ? "-250px" : "0px";
}else{
sidebar.style.left = sidebar.style.left==="0px" ? "-250px" : "0px";
}

}

function goTo(p) {

  if (lang === "ar") {
    if (p === "../feedback.html") p = "../feedback-ar.html";
    if (p === "../about.html") p = "../about-us-ar.html";
    if (p === "../contact.html") p = "../contact-us-ar.html";
    if (p === "../faq.html") p = "../faq-ar.html";
  }

  window.location.href = p;
}
loadDoctorProfile();

window.toggleSidebar = toggleSidebar;
window.setLang = setLang;
window.goTo = goTo;

window.saveBooking = saveBooking;
window.closePopup = closePopup;
window.deleteBooking = deleteBooking;
window.closeView = closeView;
window.logout = logout;

</script>

</body>
</html>
