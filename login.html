<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Diab Muaazir</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="form-container">
    <img class="auth-logo" src="images/diab muaazir.svg" alt="Logo">

    <h2>Login</h2>

<form id="loginForm" novalidate>
      <div class="input-group">
    <input id="loginEmail" type="email" placeholder="Email" required>
      </div>

    <div class="input-group password-group">
<div class="password-wrapper">
  <input id="loginPassword" type="password" placeholder="Password" required>
  <span id="togglePassword" class="toggle">Show</span>
</div>
</div>
  <div class="forgot-password">
  <a href="#" id="forgotPasswordLink" class="forgot-link">
    Forgot Password?
  </a>
</div>
  <small id="loginError" class="error-message"></small>
      <button type="submit" class="btn">Login</button>

      <p class="form-link">
        Don't have an account?
        <a href="register.html">Register here</a>
      </p>
    <a href="index.html" class="back-link" >← Go Back</a>

    </form>

    <div id="otpSection" style="display:none; margin-top:20px;">
  <input id="otpInput" placeholder="Enter verification code" />
  <button id="verifyOtp">Verify Code</button>
</div>
  </div>

  <script type="module" src="js/script.js"></script>

</body>
</html>
