<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings</title>

<style>

body{
    margin:0;
    font-family: Arial;
    background:#ffffff;
}

/* 🔥 TOP BAR */
.topbar{
    height:60px;
    background:#effcff;
    display:flex;
    align-items:center;
    padding:0 20px;
    position:relative;
}

/* MENU */
.menu{font-size:28px;cursor:pointer;}

/* 🔥 LOGO */
.header-logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}
.header-logo img{
    height:40px;
}

/* ICONS */
.top-icons{
    display:flex;
    gap:15px;
    align-items:center;
    margin-left:auto;
}
.top-icons img{
    width:22px;
    cursor:pointer;
}

/* 🔴 BADGE (إضافة فقط) */
.notif-wrapper{
position:relative;
display:inline-block;
}

.notif-badge{
position:absolute;
top:-6px;
right:-6px;
background:red;
color:white;
font-size:11px;
min-width:16px;
height:16px;
padding:0 4px;
border-radius:10px;
display:none;
align-items:center;
justify-content:center;
font-weight:bold;
}

/* 🌐 LANGUAGE */
.lang-switcher{
    position:relative;
}

.lang-dropdown{
    position:absolute;
    top:28px;
    right:0;
    background:#fff;
    display:none;
    border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.lang-dropdown.active{
    display:block;
}

.lang-option{
    padding:6px 10px;
    cursor:pointer;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    top:60px;
    left:-250px;
    right:auto;
    width:230px;
    height:100%;
    background:#effcff;
    padding:15px;
    transition:0.3s;
}

.profile-header{
    display:flex;
    gap:10px;
    align-items:center;
}

.profile-header img{width:40px;}
.profile-info{font-size:14px;color:#2c5d7c;}

.menu-item{
    display:flex;
    gap:10px;
    margin-top:15px;
    cursor:pointer;
    color:#2c5d7c;
}

.menu-item img{width:20px;}

/* CONTENT */
.content{
    padding-top:120px;
    display:flex;
    justify-content:center;
}

.settings-box{
    background:#effcff;
    width:450px;
    padding:20px;
    border-radius:10px;
}

.title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    color:#2c5d7c;
    font-weight:bold;
}

.title img{
    width:28px;
    height:28px;
}
.form-row{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

.field{width:48%;}

label{font-size:13px;color:#2c5d7c;}

.input-edit{
    display:flex;
    border:1px solid #999;
    padding:5px;
}

.input-edit input{
    border:none;
    background:transparent;
    width:100%;
}

input:focus{outline:none;}

#resetPasswordBtn {
    width: 100%;
    padding: 8px;
    border: none;
    background: #2c5d7c;
    color: white;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
}

#resetPasswordBtn:hover {
    opacity: 0.9;
}
 #saveSettingsBtn {
    width: 100%;
    padding: 10px;
    border: none;
    background: #2c5d7c;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
}

#saveSettingsBtn:hover {
    opacity: 0.9;
}


</style>
</head>

<body>

<!-- 🔥 TOP BAR -->
<div class="topbar">

<div class="menu" onclick="toggleSidebar()">☰</div>

<!-- LOGO -->
<div class="header-logo">
<img src="../images/diab muaazir.svg">
</div>

<!-- ICONS -->
<div class="top-icons">

<img src="../images/location.svg">

<!-- 🔔 التعديل هنا -->
<div class="notif-wrapper" onclick="goTo('critical patient.html')">
<img src="../images/notifications.svg">
<span id="notifBadge" class="notif-badge"></span>
</div>

<!-- LANGUAGE -->
<div class="lang-switcher">
<img src="../images/language.svg" id="langToggle">

<div class="lang-dropdown" id="langDropdown">
<div class="lang-option" data-lang="en">English</div>
<div class="lang-option" data-lang="ar">العربية</div>
</div>
</div>

</div>

</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<div class="profile-header">
<img src="../images/profile icon.png">
<div class="profile-info" id="profileInfo"></div>
</div>

<div class="menu-item" onclick="goTo('profile.html')">
<img src="../images/profile.png">
<span id="navProfile"></span>
</div>

<div class="menu-item" onclick="goTo('patients.html')">
<img src="../images/patients.png">
<span id="navPatients"></span>
</div>

<div class="menu-item" onclick="goTo('calendar.html')">
    <img src="../images/calendar.png">
    <span id="navCalendar"></span>
</div>

<div class="menu-item">
<img src="../images/gear.svg">
<span id="navSettings"></span>
</div>

<div class="menu-item" onclick="goTo('../feedback.html')">
<img src="../images/feedback.png">
<span id="navFeedback"></span>
</div>

<div class="menu-item" onclick="goTo('../about.html')">
<img src="../images/info.svg">
<span id="navAbout"></span>
</div>

<div class="menu-item" onclick="goTo('../contact.html')">
<img src="../images/phone.svg">
<span id="navContact"></span>
</div>

<div class="menu-item" onclick="goTo('../faq.html')">
<img src="../images/frequently asked questions.png"><span id="navfaq"></span>
</div>

<div class="menu-item" onclick="logout()">
  <span id="navLogout">Logout</span>
</div>
</div>

<!-- CONTENT -->
<div class="content">
<div class="settings-box">

<div class="title">
<img src="../images/gear.svg">
<span id="title"></span>
</div>

<div class="form-row">
<div class="field">
<label id="name"></label>
<div class="input-edit">
<input id="nameInput">
</div>
</div>

<div class="field">
<label id="dob"></label>
<div class="input-edit">
<input id="dobInput">
</div>
</div>
</div>

<div class="form-row">
<div class="field">
<label id="age"></label>
<div class="input-edit">
<input id="ageInput" readonly>
</div>
</div>

<div class="field">
    <label id="pass"></label>
    <div class="input-edit">
    <button id="resetPasswordBtn" type="button">
    Reset Password
    </button>
    </div>
    </div>
</div>

<div class="form-row">
<div class="field">
<label id="phone"></label>
<div class="input-edit">
<input
  id="phoneInput"
  type="tel"
  maxlength="10"
  placeholder="05XXXXXXXX">
</div>
</div>

<div class="field">
<label id="address"></label>
<div class="input-edit">
<input id="addressInput">
</div>
</div>
</div>

<!-- Certificate -->
<div class="form-row">
<div class="field" style="width:100%;">
<label id="certificateLabel"></label>
<div class="input-edit">
<input type="file" id="certificateInput">
</div>
</div>
</div>

<!-- Save Button -->
<div style="margin-top:20px;">
<button id="saveSettingsBtn" type="button">
Save Changes
</button>
</div>
</div>
</div>

<script type="module">

let lang = localStorage.getItem("lang") || "en";
import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { db, auth } from "../js/firebase-config.js";

import {
  doc,
  getDoc,
  updateDoc,
  getDocs,
  collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
  window.location.href = "../index.html";
}

let sidebar = document.getElementById("sidebar");
let icons = document.querySelector(".top-icons");

async function logout() {
  try {
    await signOut(auth); // 🔥 Firebase logout

    // 🔥 clear app session
    localStorage.removeItem("currentUser");
    localStorage.removeItem("selectedPatient");

    // optional: clear everything
    // localStorage.clear();

    // 🔥 redirect to login page
    window.location.href = "../index.html";

  } catch (error) {
    console.error(error);
    alert("Logout failed");
  }
}

/* 🔴 BADGE */
async function updateNotificationBadge(){

  const badge = document.getElementById("notifBadge");

  try {
    const snapshot = await getDocs(collection(db, "Patient"));

    let count = 0;

    snapshot.forEach(docSnap => {
      const data = docSnap.data();

      if (data.status === "high" || data.status === "low") {
        count++;
      }
    });

    if (count > 0) {
      badge.style.display = "flex";
      badge.textContent = count > 9 ? "9+" : count;
    } else {
      badge.style.display = "none";
    }

  } catch (error) {
    console.error(error);
  }
}

setInterval(updateNotificationBadge,5000);
updateNotificationBadge();

/* 🔥 LANGUAGE UI */
document.getElementById("langToggle").onclick = (e)=>{
e.stopPropagation();
document.getElementById("langDropdown").classList.toggle("active");
};

document.querySelectorAll(".lang-option").forEach(opt=>{
opt.onclick = ()=>{
localStorage.setItem("lang", opt.dataset.lang);
location.reload();
};
});

document.onclick = ()=>{
document.getElementById("langDropdown").classList.remove("active");
};

/* 🔥 اتجاه + ترتيب */
if(lang === "ar"){
document.body.style.direction="rtl";
sidebar.style.right="-250px";
sidebar.style.left="auto";
icons.style.marginLeft="0";
icons.style.marginRight="auto";
}else{
sidebar.style.left="-250px";
sidebar.style.right="auto";
icons.style.marginRight="0";
icons.style.marginLeft="auto";
}

/* ترجمة (نفس كودك) */
if(lang === "ar"){

document.getElementById("title").innerText="الإعدادات";
document.getElementById("name").innerText="الاسم الكامل";
document.getElementById("dob").innerText="تاريخ الميلاد";
document.getElementById("age").innerText="العمر";
document.getElementById("pass").innerText="إعادة تعيين كلمة المرور";
document.getElementById("phone").innerText="رقم الجوال";
document.getElementById("address").innerText="العنوان";
document.getElementById("certificateLabel").innerText = "الشهادة";
document.getElementById("profileInfo").innerHTML="<b>د. محمد</b><br>العمر: 37<br>Mohamed@gmail.com";

document.getElementById("navProfile").innerText="الملف الشخصي";
document.getElementById("navPatients").innerText="المرضى";
document.getElementById("navCalendar").innerText = "التقويم";
document.getElementById("navSettings").innerText="الإعدادات";
document.getElementById("navFeedback").innerText="الملاحظات";
document.getElementById("navAbout").innerText="من نحن";
document.getElementById("navContact").innerText="تواصل معنا";
document.getElementById("navfaq").innerText = "الأسئلة الشائعة";
document.getElementById("navLogout").innerText="تسجيل الخروج";


}else{

document.getElementById("title").innerText="Settings";
document.getElementById("name").innerText="Full Name";
document.getElementById("dob").innerText="Date of Birth";
document.getElementById("age").innerText="Age";
document.getElementById("pass").innerText =
  lang === "ar"
    ? "إعادة تعيين كلمة المرور"
    : "Reset Password";
document.getElementById("phone").innerText="Phone Number";
document.getElementById("address").innerText="Address";
document.getElementById("certificateLabel").innerText = "Certificate";

document.getElementById("navProfile").innerText="Profile";
document.getElementById("navPatients").innerText="Patients";
document.getElementById("navCalendar").innerText = "Calendar";
document.getElementById("navSettings").innerText="Settings";
document.getElementById("navFeedback").innerText="Feedback";
document.getElementById("navAbout").innerText="About us";
document.getElementById("navContact").innerText="Contact us";
document.getElementById("navfaq").innerText="FAQ";
document.getElementById("navLogout").innerText="Logout";

}


/* المنيو */
function toggleSidebar(){
if(lang === "ar"){
sidebar.style.right = sidebar.style.right==="0px"?"-250px":"0px";
}else{
sidebar.style.left = sidebar.style.left==="0px"?"-250px":"0px";
}
}

function goTo(p) {
  if (lang === "ar") {
    if (p === "../feedback.html") p = "../feedback-ar.html";
    if (p === "../about.html") p = "../about-us-ar.html";
    if (p === "../contact.html") p = "../contact-us-ar.html";
    if (p === "../faq.html") p = "../faq-ar.html";
  }

  window.location.href = p;
}

async function resetPassword() {
  const savedUser = JSON.parse(localStorage.getItem("currentUser"));

  if (!savedUser || !savedUser.email) {
    alert("User email not found");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, savedUser.email);

    alert(
      lang === "ar"
        ? "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني"
        : "Password reset email has been sent"
    );

  } catch (error) {
    console.error(error);
    alert(error.message);
  }
}

async function loadDoctorSettings() {
  const savedUser = JSON.parse(localStorage.getItem("currentUser"));

  if (!savedUser || !savedUser.uid) return;

  try {
    const doctorRef = doc(db, "Doctor", savedUser.uid);
    const doctorSnap = await getDoc(doctorRef);

    if (!doctorSnap.exists()) return;

    const data = doctorSnap.data();

    document.getElementById("profileInfo").innerHTML = `
      <b>${data.firstName || ""} ${data.lastName || ""}</b><br>
      ${lang === "ar" ? "العمر" : "Age"}: ${data.age || "--"}<br>
      ${data.email || ""}
    `;

    document.getElementById("nameInput").value =
      `${data.firstName || ""} ${data.lastName || ""}`.trim();

    document.getElementById("dobInput").value =
      data.dob || "";

    document.getElementById("ageInput").value =
      data.age || "";

    document.getElementById("phoneInput").value =
      data.phone || "";

    document.getElementById("addressInput").value =
      data.address || "";

  } catch (error) {
    console.error("Error loading settings:", error);
  }
}
function calculateAge(dob) {
  if (!dob) return "";

  const birthDate = new Date(dob);
  const today = new Date();

  let age = today.getFullYear() - birthDate.getFullYear();

  const monthDiff = today.getMonth() - birthDate.getMonth();

  if (
    monthDiff < 0 ||
    (monthDiff === 0 && today.getDate() < birthDate.getDate())
  ) {
    age--;
  }

  return age;
}
async function saveDoctorSettings() {
  const savedUser = JSON.parse(localStorage.getItem("currentUser"));

  if (!savedUser || !savedUser.uid) return;

  try {
    const doctorRef = doc(db, "Doctor", savedUser.uid);

    const fullName = document.getElementById("nameInput").value.trim();
    const phone = document.getElementById("phoneInput").value.trim();
    const address = document.getElementById("addressInput").value.trim();
    const dob = document.getElementById("dobInput").value.trim();
    const age = calculateAge(dob);
      document.getElementById("ageInput").value = age;
    const nameParts = fullName.split(" ");
    const firstName = nameParts[0] || "";
    const lastName = nameParts.slice(1).join(" ") || "";


if (!/^05\d{8}$/.test(phone)) {
  alert(
    lang === "ar"
      ? "رقم الجوال يجب أن يبدأ بـ 05 ويتكون من 10 أرقام"
      : "Phone number must start with 05 and contain 10 digits"
  );
  return;
}
const certificateFile =
  document.getElementById("certificateInput").files[0];

let certificateName = "";

if (certificateFile) {
  certificateName = certificateFile.name;
}
    await updateDoc(doctorRef, {
      firstName: firstName,
      lastName: lastName,
      phone: phone,
      address: address,
      dob: dob,
      age: age,
      certificateName: certificateName
    });

    alert(
      lang === "ar"
        ? "تم حفظ التعديلات بنجاح"
        : "Settings updated successfully"
    );

  } catch (error) {
    console.error(error);
    alert(error.message);
  }
}
loadDoctorSettings();
document.getElementById("saveSettingsBtn")
  .addEventListener("click", saveDoctorSettings);
document.getElementById("resetPasswordBtn")
  .addEventListener("click", resetPassword);

window.toggleSidebar = toggleSidebar;
window.goTo = goTo;
window.logout = logout;

</script>

</body>
</html>
