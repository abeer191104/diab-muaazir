<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify OTP</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
    }

    .box {
      width: 300px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      margin-top: 15px;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      cursor: pointer;
    }

    .error {
      color: red;
      margin-top: 10px;
    }

    .timer {
      margin-top: 10px;
      color: gray;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Enter OTP</h2>

    <p>Check your email (or demo alert)</p>

    <input id="otpInput" placeholder="Enter 6-digit code" maxlength="6" />

    <button id="verifyBtn">Verify</button>

    <div class="timer" id="timer"></div>
    <div class="error" id="error"></div>
  </div>

  <script type="module" src="otp.js"></script>
</body>
</html>
